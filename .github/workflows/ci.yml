name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # Verhindere Loop: Nicht bei push von github-actions[bot]
    if: github.actor != 'github-actions[bot]' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Python einrichten
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14.9'

      - name: Test- und Lint-Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-ci.txt
          cutoff=$(date -u -d '168 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          uv pip install --python "$(command -v python)" --index-url https://pypi.org/simple \
            --exclude-newer "$cutoff" -r requirements_test.txt

      - name: Lint (flake8)
        run: |
          flake8 . || echo "Lint-Warnungen gefunden (E/W werden derzeit nicht geblockt)"

      - name: Tests ausführen
        run: |
          set +e
          pytest -q --maxfail=1 --disable-warnings
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "Keine Tests gefunden – CI OK"
            exit 0
          fi
          exit $code



