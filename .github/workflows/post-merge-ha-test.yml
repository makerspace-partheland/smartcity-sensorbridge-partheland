name: Home-Assistant-Kompatibilität
run-name: >-
  ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from) &&
      format('HA-Test PR {0} {1}', github.event.number, github.sha) ||
      (github.event_name == 'pull_request' && format('HA-Status PR {0}', github.event.number)) || '' }}

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/requirements-ci.txt'
      - '.github/scripts/update_requirements.py'
      - '.github/workflows/post-merge-ha-test.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate-sha:
        type: string
        default: ""
    outputs:
      tested_homeassistant_version:
        description: Home-Assistant-Version aus einem erfolgreichen Testlauf
        value: ${{ jobs.ha-compatibility-test.outputs.tested_homeassistant_version }}
      packages:
        description: Installierte Pakete aus einem erfolgreichen HA-Testlauf
        value: ${{ jobs.ha-compatibility-test.outputs.packages }}

permissions:
  contents: read

jobs:
  ha-compatibility-test:
    # Entwürfe dürfen keinen erfolgreichen Pflichtcheck melden.
    name: ${{ github.event.pull_request.draft && 'Entwurf' || 'ha-compatibility-test' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    concurrency:
      group: ha-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.candidate-sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') }}
    runs-on: ubuntu-latest
    outputs:
      tested_homeassistant_version: ${{ steps.tests.outputs.tested_homeassistant_version }}
      packages: ${{ steps.dependencies.outputs.packages }}

    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Prüfergebnis nach einer Textänderung bestätigen
        id: previous
        if: github.event.action == 'edited' && !github.event.changes.base.ref.from
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_TITLE: ${{ format('HA-Test PR {0} {1}', github.event.number, github.sha) }}
        run: |
          set -euo pipefail
          # Nur der letzte vollständige Lauf für dieses PR-Merge-Ergebnis zählt.
          previous=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/post-merge-ha-test.yml/runs" \
            -f event=pull_request -f head_sha="$HEAD_SHA" -f per_page=100 |
            jq -r --arg title "$EXPECTED_TITLE" '[.workflow_runs[] | select(.display_title == $title)] | first | {id, conclusion}')
          result=$(jq -r '.conclusion // ""' <<< "$previous")
          if [[ "$result" == success ]]; then
            run_id=$(jq -er '.id' <<< "$previous")
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs")
            if jq -e --arg step "HA-Kompatibilität $GITHUB_SHA" \
              'any(.jobs[]; .name == "ha-compatibility-test" and .conclusion == "success" and
                any(.steps[]; .name == $step and .conclusion == "success"))' <<< "$jobs" >/dev/null; then
              echo "passed=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$result" == failure ]]; then
            echo "Der vollständige HA-Test für dieses Merge-Ergebnis ist fehlgeschlagen."
            exit 1
          fi

      - name: Verifizierte Dependabot-Metadaten abrufen
        if: steps.previous.outputs.passed != 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        id: dependabot
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Vorabversionen von Dependabot ablehnen
        if: steps.previous.outputs.passed != 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCIES: ${{ steps.dependabot.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          updates=$(jq -er 'select(type == "array" and length > 0) | .[] | [.packageEcosystem, .newVersion, .dependencyName] | @tsv' <<< "$DEPENDENCIES")
          while IFS=$'\t' read -r ecosystem version dependency; do
            if [[ "$ecosystem" == pip ]]; then
              # PEP 440 erlaubt für stabile Versionen auch Epoch und Post-Releases.
              if [[ ! "$version" =~ ^([0-9]+!)?[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ || -z "$dependency" ]]; then
                echo "Python-Abhängigkeit ohne eindeutige stabile Versionsangabe abgelehnt."
                exit 1
              fi
              continue
            fi
            if [[ "$ecosystem" != github_actions || ! "$version" =~ ^v?[0-9]+(\.[0-9]+){0,2}$ || ! "$dependency" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+(/[a-zA-Z0-9_.-]+)*$ ]]; then
              echo "Dependabot-Update ohne eindeutige stabile Versionsangabe abgelehnt."
              exit 1
            fi
            upstream=$(cut -d / -f 1,2 <<< "$dependency")
            # Auch rein numerische Tags können auf GitHub als Vorabversion markiert sein.
            prerelease=$(gh api --paginate "repos/$upstream/releases?per_page=100" | jq -r --arg version "${version#v}" '.[] | select(.prerelease and (.tag_name | sub("^v"; "")) == $version) | .tag_name')
            if [[ -n "$prerelease" ]]; then
              echo "Als Vorabversion markiertes Dependabot-Update abgelehnt."
              exit 1
            fi
          done <<< "$updates"

      - name: Repository auschecken
        if: steps.previous.outputs.passed != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          persist-credentials: false

      - name: Offiziellen Home-Assistant-Teststand ermitteln
        if: steps.previous.outputs.passed != 'true'
        id: test-stack
        run: python3 .github/scripts/update_requirements.py --test-stack >> "$GITHUB_OUTPUT"

      - name: Python einrichten
        if: steps.previous.outputs.passed != 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ steps.test-stack.outputs.python_version }}

      - name: Testabhängigkeiten installieren
        if: steps.previous.outputs.passed != 'true'
        env:
          TESTED_HA: ${{ steps.test-stack.outputs.homeassistant_version }}
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-ci.txt
          cutoff=$(date -u -d '168 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          uv pip install --python "$(command -v python)" --index-url https://pypi.org/simple \
            --exclude-newer "$cutoff" -r requirements_test.txt "pytest-homeassistant==$TESTED_HA"

      - name: Laufzeitabhängigkeiten der Integration installieren
        if: steps.previous.outputs.passed != 'true'
        env:
          TESTED_HA: ${{ steps.test-stack.outputs.homeassistant_version }}
        run: |
          set -euo pipefail
          manifest=custom_components/sensorbridge_partheland/manifest.json
          constraints=$(python -c 'from pathlib import Path; import homeassistant; print(Path(homeassistant.__file__).with_name("package_constraints.txt"))')
          requirements_file="$RUNNER_TEMP/sensorbridge-runtime-requirements.txt"
          jq -r '(if has("requirements") then .requirements else [] end) |
            if type == "array" and all(.[]; type == "string" and length > 0 and (test("[\\r\\n]") | not))
            then .[] else error("Ungültige Laufzeitabhängigkeiten im Manifest") end' "$manifest" > "$requirements_file"
          mapfile -t runtime_requirements < "$requirements_file"
          cutoff=$(date -u -d '168 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          uv pip install --python "$(command -v python)" --index-url https://pypi.org/simple \
            --exclude-newer "$cutoff" -c "$constraints" -r requirements_test.txt \
            "pytest-homeassistant==$TESTED_HA" -- "${runtime_requirements[@]}"

      - name: Lint und Paketerfassung prüfen
        if: steps.previous.outputs.passed != 'true' && github.event_name == 'pull_request'
        run: |
          flake8 . || echo "Lint-Warnungen gefunden (E/W werden derzeit nicht geblockt)"
          python3 -B .github/scripts/test_dependency_snapshot.py

      - name: HA-Kompatibilität ${{ github.sha }}
        if: steps.previous.outputs.passed != 'true'
        id: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXPECTED_HOMEASSISTANT_VERSION: ${{ steps.test-stack.outputs.homeassistant_version }}
        run: |
          set -euo pipefail
          INSTALLED_HOMEASSISTANT_VERSION=$(python -c "from importlib.metadata import version; print(version('homeassistant'))")
          if [ "$INSTALLED_HOMEASSISTANT_VERSION" != "$EXPECTED_HOMEASSISTANT_VERSION" ]; then
            echo "Installierte Home-Assistant-Version stimmt nicht mit dem Testziel überein"
            exit 1
          fi
          python -m pytest -v --tb=short --disable-warnings --strict-markers
          echo "tested_homeassistant_version=$INSTALLED_HOMEASSISTANT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Home Assistant $INSTALLED_HOMEASSISTANT_VERSION Kompatibilitätstest erfolgreich"

      - name: Installierte HA-Testabhängigkeiten erfassen
        id: dependencies
        if: >-
          steps.tests.outputs.tested_homeassistant_version != '' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && github.ref_protected
        run: |
          set -euo pipefail
          python -m pip inspect | python -B .github/scripts/dependency_snapshot.py
