name: Post-Merge HA Compatibility Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      force-test:
        description: Kompatibilität unabhängig vom Dateidiff prüfen
        type: boolean
        default: false
    outputs:
      tested_homeassistant_version:
        description: Home-Assistant-Version aus einem erfolgreichen Testlauf
        value: ${{ jobs.ha-compatibility-test.outputs.tested_homeassistant_version }}

permissions:
  contents: read

jobs:
  ha-compatibility-test:
    runs-on: ubuntu-latest
    outputs:
      tested_homeassistant_version: ${{ steps.tests.outputs.tested_homeassistant_version }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prüfe ob HA-Test nötig ist
        id: check-needed
        env:
          FORCE_TEST: ${{ inputs.force-test || false }}
        run: |
          set -euo pipefail

          if [ "${FORCE_TEST}" = "true" ]; then
            echo "test_needed=true" >> "${GITHUB_OUTPUT}"
            echo "Aufruf für die wöchentliche Aktualisierung - HA-Test wird ausgeführt"
            exit 0
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "test_needed=true" >> "${GITHUB_OUTPUT}"
            echo "Manuelle Ausführung - HA-Test wird ausgeführt"
            exit 0
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_BRANCH="${GITHUB_BASE_REF}"
            git fetch origin "${BASE_BRANCH}" --depth=1
            DIFF_BASE="origin/${BASE_BRANCH}"
          else
            DIFF_BASE="HEAD~1"
          fi

          # Prüfe ob HA-relevante Dateien geändert wurden
          if git diff "${DIFF_BASE}" HEAD --name-only | grep -E "(requirements.*\.txt|manifest\.json)"; then
            echo "test_needed=true" >> "${GITHUB_OUTPUT}"
            echo "HA-relevante Änderungen erkannt - Test wird ausgeführt"
          else
            echo "test_needed=false" >> "${GITHUB_OUTPUT}"
            echo "Keine HA-relevanten Änderungen - Test wird übersprungen"
          fi

      - name: HA-Test überspringen
        if: steps.check-needed.outputs.test_needed == 'false'
        run: |
          echo "HA-Kompatibilitätstest übersprungen - keine relevanten Änderungen"
          echo "Check erfolgreich abgeschlossen"

      - name: Veröffentlichten PHACC-Teststand ermitteln
        if: steps.check-needed.outputs.test_needed == 'true'
        id: test-stack
        run: |
          python3 - <<'PYTHON'
          import os
          import sys
          sys.path.insert(0, ".github/scripts")
          from update_requirements import fetch_pytest_ha_version, fetch_pytest_ha_requirements

          phacc_version = fetch_pytest_ha_version()
          if not phacc_version:
              raise SystemExit("Kein geeigneter veröffentlichter PHACC-Teststand verfügbar.")
          homeassistant_version = fetch_pytest_ha_requirements(phacc_version).get("homeassistant")
          if not homeassistant_version:
              raise SystemExit("Die Home-Assistant-Version des PHACC-Teststands fehlt.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("python_version=3.14.10\n")
              output.write(f"phacc_version={phacc_version}\n")
              output.write(f"homeassistant_version={homeassistant_version}\n")
          print(f"PHACC {phacc_version}, Home Assistant {homeassistant_version}")
          PYTHON

      - name: Python einrichten
        if: steps.check-needed.outputs.test_needed == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ steps.test-stack.outputs.python_version }}

      - name: Dependencies installieren
        if: steps.check-needed.outputs.test_needed == 'true'
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-ci.txt
          cutoff=$(date -u -d '168 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          grep -Eiv '^[[:space:]]*(homeassistant|pytest-homeassistant-custom-component)[[:space:]]*(==|>=|<=|~=|>|<)' \
            requirements_test.txt > "$RUNNER_TEMP/requirements_test_base.txt" || test "$?" -eq 1
          uv pip install --python "$(command -v python)" --index-url https://pypi.org/simple \
            --exclude-newer "$cutoff" -r "$RUNNER_TEMP/requirements_test_base.txt" \
            "pytest-homeassistant-custom-component==${{ steps.test-stack.outputs.phacc_version }}" \
            "homeassistant==${{ steps.test-stack.outputs.homeassistant_version }}"

      - name: Kompatibilitätstest ausführen
        if: steps.check-needed.outputs.test_needed == 'true'
        id: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXPECTED_HOMEASSISTANT_VERSION: ${{ steps.test-stack.outputs.homeassistant_version }}
        run: |
          set -euo pipefail
          INSTALLED_HOMEASSISTANT_VERSION=$(python -c "from importlib.metadata import version; print(version('homeassistant'))")
          if [ "$INSTALLED_HOMEASSISTANT_VERSION" != "$EXPECTED_HOMEASSISTANT_VERSION" ]; then
            echo "Installierte Home-Assistant-Version stimmt nicht mit dem Testziel überein"
            exit 1
          fi
          set +e
          export PYTHONPATH="${GITHUB_WORKSPACE}:${PYTHONPATH}"
          python -m pytest -v --tb=short -k "not slow" --disable-warnings --strict-markers
          TEST_RESULT=$?
          set -e

          if [ $TEST_RESULT -eq 0 ]; then
            echo "test_status=success" >> "${GITHUB_OUTPUT}"
            echo "tested_homeassistant_version=$INSTALLED_HOMEASSISTANT_VERSION" >> "${GITHUB_OUTPUT}"
            echo "test_summary=Alle Tests erfolgreich mit HA ${{ steps.test-stack.outputs.homeassistant_version }}" >> "${GITHUB_OUTPUT}"
          elif [ $TEST_RESULT -eq 5 ]; then
            echo "test_status=no-tests" >> "${GITHUB_OUTPUT}"
            echo "test_summary=Keine Tests gefunden" >> "${GITHUB_OUTPUT}"
          else
            echo "test_status=failed" >> "${GITHUB_OUTPUT}"
            echo "test_summary=Tests fehlgeschlagen mit HA ${{ steps.test-stack.outputs.homeassistant_version }}" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Erfolg dokumentieren
        if: steps.tests.outputs.test_status == 'success'
        run: |
          echo "Home Assistant ${{ steps.test-stack.outputs.homeassistant_version }} Kompatibilitätstest erfolgreich"
          echo "Alle Tests bestanden"
