name: Wöchentliche Abhängigkeitsaktualisierung (pip + manifest)

on:
  schedule:
    - cron: '17 5 * * 5'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/post-merge-ha-test.yml
    with:
      force-test: true

  update:
    needs: compatibility
    # Nur vertrauenswürdiges main darf mit dem bestehenden Token einen PR schreiben.
    # Der wiederverwendete HA-Test erhält weder Schreibrechte noch Secrets.
    if: github.ref == 'refs/heads/main' && needs.compatibility.outputs.tested_homeassistant_version != ''
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14.10'

      - name: Requirements aktualisieren (nur patch/minor)
        id: update-deps
        env:
          TESTED_HOMEASSISTANT_VERSION: ${{ needs.compatibility.outputs.tested_homeassistant_version }}
        run: |
          python .github/scripts/update_requirements.py --tested-homeassistant-version "$TESTED_HOMEASSISTANT_VERSION"
          if git diff --unified=0 -- requirements_test.txt | grep -Eq '^[+-]homeassistant[[:space:]]'; then
            HA_VERSION=$(grep "^homeassistant" requirements_test.txt | sed -E 's/^[^#]*homeassistant[[:space:]]*(==|>=)[[:space:]]*//')
            echo "ha_updated=true" >> $GITHUB_OUTPUT
            echo "homeassistant_version=$HA_VERSION" >> $GITHUB_OUTPUT
            echo "Home Assistant wird auf Version $HA_VERSION aktualisiert"
          else
            echo "ha_updated=false" >> $GITHUB_OUTPUT
            echo "homeassistant_version=" >> $GITHUB_OUTPUT
          fi

      - name: Pull Request erstellen
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          commit-message: |
            deps: wöchentliche Abhängigkeitsaktualisierungen (patch/minor)
          title: "deps: wöchentliche Abhängigkeitsaktualisierungen (patch/minor)"
          body: |
            Automatische Aktualisierung der Python-Abhängigkeiten.

            ${{ steps.update-deps.outputs.ha_updated == 'true' && format('Home Assistant: {0}', steps.update-deps.outputs.homeassistant_version) || '' }}
          labels: dependencies, python
          branch: chore/weekly-deps-update
          delete-branch: true
