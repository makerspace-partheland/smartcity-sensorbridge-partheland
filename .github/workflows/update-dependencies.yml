name: Wöchentliche Abhängigkeitsaktualisierung (pip + manifest)

on:
  schedule:
    - cron: '17 5 * * 4'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/post-merge-ha-test.yml

  dependency-graph:
    needs: compatibility
    if: >-
      github.ref == 'refs/heads/main' && github.ref_protected &&
      needs.compatibility.outputs.packages != ''
    permissions:
      contents: write
    uses: ./.github/workflows/submit-test-dependencies.yml
    with:
      packages: ${{ needs.compatibility.outputs.packages }}
      test-scope: ha

  update:
    needs: compatibility
    # Nur vertrauenswürdiges main darf mit dem bestehenden Token einen PR schreiben.
    # Der wiederverwendete HA-Test erhält weder Schreibrechte noch Secrets.
    if: github.ref == 'refs/heads/main' && needs.compatibility.outputs.tested_homeassistant_version != ''
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Requirements aktualisieren (nur patch/minor)
        id: update-deps
        env:
          TESTED_HOMEASSISTANT_VERSION: ${{ needs.compatibility.outputs.tested_homeassistant_version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update_requirements.py --tested-homeassistant-version "$TESTED_HOMEASSISTANT_VERSION"
          if ! git diff --quiet -- README.md; then
            echo "readme_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Request erstellen
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          commit-message: |
            deps: wöchentliche Abhängigkeitsaktualisierungen (patch/minor)
          title: "deps: wöchentliche Abhängigkeitsaktualisierungen (patch/minor)"
          body: |
            Automatische Aktualisierung der Python-Abhängigkeiten.

            Die GitHub-Tests mit Home Assistant ${{ needs.compatibility.outputs.tested_homeassistant_version }} waren erfolgreich.

            ${{ steps.update-deps.outputs.readme_updated == 'true' && 'Die Versionsangaben in der README wurden aktualisiert.' || '' }}
          labels: dependencies, python
          branch: chore/weekly-deps-update
          delete-branch: true
