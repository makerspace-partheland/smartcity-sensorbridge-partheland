name: Sicherheitsmeldungen prüfen

on:
  schedule:
    - cron: '41 5 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-detection
  cancel-in-progress: false

jobs:
  detect:
    name: Sicherheitsmeldungen prüfen
    if: github.repository == 'makerspace-partheland/smartcity-sensorbridge-partheland' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      # Nur der geschützte Hauptbranch wird mit Leserechten ausgeführt.
      - name: Quellstand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Meldungen abgleichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/security_detection.py
