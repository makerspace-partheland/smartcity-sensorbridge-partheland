name: Öffentliche Sicherheitskataloge prüfen
description: Fasst öffentliche Sicherheitshinweise zu Abhängigkeiten ohne Paketinstallation zusammen
runs:
  using: composite
  steps:
    - name: Öffentliche Hinweise zusammenfassen
      shell: bash
      env:
        INVENTORY_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: python3 -B "$INVENTORY_ACTION_PATH/inventory.py"
